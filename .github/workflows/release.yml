---
name: release
on:
  push:
    branches:
      - main
    paths:
      - package.json
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_VERSION="v$(yq -r .version package.json)"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

          PREVIOUS_VERSION="v$(git show "${{ github.event.before }}:package.json" | yq -r .version -)"

          RELEASE_VIEW_OUTPUT="$(gh release view "$PACKAGE_VERSION" 2>&1)" && RELEASE_EXISTS=true || RELEASE_EXISTS=false

          if [ "$RELEASE_EXISTS" = false ] && ! (echo "$RELEASE_VIEW_OUTPUT" | grep -qi "release not found")
          then
            echo "::error::Failed to check whether $PACKAGE_VERSION already has a release: $RELEASE_VIEW_OUTPUT"
            exit 1
          fi

          if [ "$PACKAGE_VERSION" != "$PREVIOUS_VERSION" ] && [ "$RELEASE_EXISTS" = false ]
          then
            echo "CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "CHANGED=false" >> "$GITHUB_ENV"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.CHANGED == 'true'
        with:
          bun-version-file: .bun-version
          no-cache: true
      - uses: flatt-security/setup-takumi-guard-npm@6d4182745c1e474c35a023573c2612c085be45a4 # v1.2.0
        if: env.CHANGED == 'true'
      - run: bun install
        if: env.CHANGED == 'true'
      - name: Build
        if: env.CHANGED == 'true'
        run: |
          bun run zip:chrome
          bun run zip:firefox
      - name: Submit to stores
        if: env.CHANGED == 'true'
        run: |
          bunx wxt submit \
               --chrome-zip dist/*-chrome.zip \
               --firefox-zip dist/*-firefox.zip --firefox-sources-zip dist/*-sources.zip
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      - name: Create release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: env.CHANGED == 'true'
        with:
          script: |
            const {createRequire} = require('node:module')
            const {tsImport} = createRequire(
              `${process.env.GITHUB_WORKSPACE}/package.json`
            )('tsx/esm/api')
            const {script} = await tsImport(
              './scripts/release/release/create_release.ts',
              process.env.GITHUB_WORKSPACE + '/'
            )
            await script(github, context)
