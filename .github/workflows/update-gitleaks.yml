---
name: update-gitleaks
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - main
  merge_group:
# Writes use a GitHub App token, so GITHUB_TOKEN only has read permission
permissions:
  contents: read
jobs:
  update-gitleaks:
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # jscpd:ignore-start
      # Fix PRs are operated on only for push and pull_request from non-fork repositories. Other events only verify the diff, so no write token is issued
      # For PRs from forks, this action verifies the diff without operating on fix PRs
      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        with:
          client-id: ${{ secrets.PROJECT_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      # jscpd:ignore-end
      - uses: dev-hato/actions-update-gitleaks@d33ae3f5380b57036a94ecb1a40344d7cb3f20d6 # v0.0.117
        with:
          github-token: ${{ steps.generate_token.outputs.token || github.token }}
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
